<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chhorvorn</title>
    <style>
        /* CSS សម្រាប់រចនាសម្រស់ */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffeef2;
            font-family: 'Khmer OS Battambang', sans-serif;
            overflow: hidden;
            text-align: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 10;
        }

        h1 {
            color: #ff4d6d;
            font-size: 2rem;
        }

        p {
            color: #555;
            font-size: 1.2rem;
        }

        .buttons {
            margin-top: 20px;
        }

        button {
            padding: 10px 25px;
            font-size: 1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            margin: 0 10px;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
        }

        #noBtn {
            background-color: #ccc;
            color: #333;
            position: relative;
        }

        /* ចលនាបេះដូងហោះ */
        .heart {
            position: absolute;
            color: #ff4d6d;
            font-size: 20px;
            animation: move 3s linear forwards;
            user-select: none;
        }

        @keyframes move {
            from { transform: translateY(100vh) scale(0.5); opacity: 1; }
            to { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="main-content">
            <h1>Khg men kmeng toch? 🙃</h1>
            <p>chhob khg tv khg jren ot laor te na! 🥲</p>
            <div class="buttons">
                <button id="yesBtn" onclick="accept()">chhob khg kr ban!</button>
                <button id="noBtn" onmouseover="moveButton()">ot jg chhob!</button>
            </div>
        </div>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.position = 'absolute';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function accept() {
            document.getElementById('main-content').innerHTML = `
                <h1>Lerk krouy kom khg tt nrr! ❤️</h1>
                <p>I'm promise chhob tver oy khg tt hx! 🙄</p>
                <img src="cute.png" width="200">
            `;
            setInterval(createHeart, 300);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 5000);
        }
    </script>
</body>
</html>
